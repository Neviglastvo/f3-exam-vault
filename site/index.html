<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#16243b">
    <meta name="description" content="Матеріали для вступного іспиту F3">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="vendor/katex/katex.min.css">
    <title>F3 — підготовка до іспиту</title>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#top">F3 <span>Підготовка</span></a>
      <label class="search"><span class="visually-hidden">Пошук</span><input id="search" type="search" placeholder="Знайти тему або термін" autocomplete="off"></label>
      <button class="offline" id="offline" type="button">Завантажити для офлайн</button>
      <button class="reset-cache" id="reset-cache" type="button">Скинути кеш</button>
      <button class="mobile-menu-toggle" id="mobile-menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu">Зміст</button>
    </header>
    <div class="layout" id="top">
      <aside class="sidebar" aria-label="Зміст">
        <nav id="navigation"><p class="loading">Завантажую зміст…</p></nav>
      </aside>
      <main>
        <div class="intro">
          <p class="eyebrow">ВСТУПНИЙ ІСПИТ</p>
          <h1>F3 — вся база в одному місці</h1>
          <p>Шукай тему, переходь за посиланнями та відкривай відповіді лише після власної спроби.</p>
          <p class="status" id="status" aria-live="polite">Готую матеріали…</p>
        </div>
        <article id="notes" aria-live="polite"></article>
      </main>
    </div>
    <template id="empty"><p class="empty">Нічого не знайдено.</p></template>
    <div class="link-preview" id="link-preview" role="tooltip" hidden></div>
    <dialog class="mobile-menu" id="mobile-menu" aria-label="Зміст">
      <header class="mobile-dialog-header">
        <strong>Зміст</strong>
        <button class="dialog-close" id="mobile-menu-close" type="button" aria-label="Закрити зміст">×</button>
      </header>
      <label class="mobile-search"><span class="visually-hidden">Пошук</span><input id="mobile-search" type="search" placeholder="Знайти тему або термін" autocomplete="off"></label>
      <nav id="mobile-navigation"><p class="loading">Завантажую зміст…</p></nav>
      <div class="mobile-actions">
        <button class="offline" id="mobile-offline" type="button">Завантажити для офлайн</button>
        <button class="reset-cache" id="mobile-reset-cache" type="button">Скинути кеш</button>
      </div>
    </dialog>
    <dialog class="mobile-preview" id="mobile-preview" aria-label="Попередній перегляд">
      <header class="mobile-dialog-header">
        <strong id="mobile-preview-title"></strong>
        <button class="dialog-close" id="mobile-preview-close" type="button" aria-label="Закрити попередній перегляд">×</button>
      </header>
      <p id="mobile-preview-text"></p>
      <a class="preview-open" id="mobile-preview-open" href="#">Відкрити тему</a>
    </dialog>
    <script src="vendor/katex/katex.min.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
